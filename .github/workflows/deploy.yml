name: Deploy

# Заливает сайт на InfinityFree по FTP после каждого пуша.
# Нужны секреты репозитория: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_SERVER_DIR
# (Settings → Secrets and variables → Actions). Без них шаг заливки пропускается.

on:
  push:
    branches:
      - main
      - claude/sharp-babbage-t64qnn
  workflow_dispatch:
    inputs:
      with_vendor:
        description: 'Залить и библиотеки Composer (core/vendor, ~17 000 файлов)'
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HAS_SECRETS: ${{ secrets.FTP_PASSWORD != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Библиотеки Composer заливаем, только если поменялся composer.lock (или попросили вручную).
      - name: Need vendor?
        id: vendor
        run: |
          if [ "${{ inputs.with_vendor }}" = "true" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          elif git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null \
            && git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qx composer.lock; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "upload=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, zip, gd
          coverage: none

      - name: Tests
        run: |
          composer install --no-interaction --prefer-dist --quiet
          cp .env.example .env
          php artisan key:generate --quiet
          php artisan test

      - name: Build
        run: deploy/build-ftp.sh build/ftp

      - name: Upload site by FTP
        if: env.HAS_SECRETS == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: build/ftp/
          protocol: ftp
          timeout: 600000
          # База, .env и загруженные файлы живут только на сервере; vendor — отдельным шагом ниже.
          exclude: |
            **/.git*
            **/.git*/**
            core/.env
            core/database/*.sqlite
            core/storage/**
            storage/**
            core/vendor/**

      - name: Upload Composer libraries by FTP
        if: env.HAS_SECRETS == 'true' && steps.vendor.outputs.upload == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}core/vendor/
          local-dir: build/ftp/core/vendor/
          protocol: ftp
          timeout: 600000
          state-name: .ftp-deploy-vendor-state.json
