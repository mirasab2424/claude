name: Deploy SmartWay

# Сайт образовательного центра SMART WAY → smart.is-best.net (тот же FTP-аккаунт InfinityFree).
# PHP + Twig: sites/smartway/public → htdocs, sites/smartway/app → htdocs/app (закрыта .htaccess).
# Правки из админки, заявки и загруженные фото живут на сервере (app/storage, uploads) и деплоем не трогаются.

on:
  push:
    branches:
      - main
      - claude/sharp-babbage-t64qnn
    paths:
      - 'sites/smartway/**'
      - '.github/workflows/deploy-smartway.yml'
  workflow_dispatch:

concurrency:
  group: deploy-smartway
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_SECRETS: ${{ secrets.FTP_PASSWORD != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Build
        working-directory: sites/smartway
        run: |
          composer install --working-dir=app --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
          # Twig без документации и тестов: меньше файлов на хостинге
          rm -rf app/vendor/twig/twig/{doc,tests,extra,bin} app/vendor/*/*/{tests,Tests,doc,docs}
          for f in app/lib/*.php app/lang/*.php app/config.php public/index.php; do php -l "$f" > /dev/null; done
          mkdir -p dist
          cp -r public/. dist/
          cp -r app dist/app && rm -rf dist/app/storage
          rm -f dist/uploads/.gitkeep
          find dist -type f | wc -l

      - name: Upload by FTP
        if: env.HAS_SECRETS == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /smart.is-best.net/htdocs/
          local-dir: sites/smartway/dist/
          protocol: ftp
          timeout: 600000
          exclude: |
            **/.git*
            **/.git*/**
            app/storage/**
            uploads/*.jpg
            uploads/*.png
            uploads/*.webp
