name: Backup sites

# Скачивает по FTP папки всех доменов аккаунта InfinityFree (трекер, miras.page.gd, SMART WAY, тесты Kostobe)
# и выкладывает архив как артефакт на 1 день. Репозиторий публичный, поэтому архив зашифрован:
# случайный ключ AES-256 закрыт открытым RSA-ключом из .github/backup/public-key.pem,
# расшифровать может только владелец закрытого ключа. Composer vendor не качаем — он восстанавливается из composer.lock.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/sharp-babbage-t64qnn
    paths:
      - '.github/workflows/backup.yml'
      - '.github/backup/**'

concurrency:
  group: backup-sites
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Download by FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          mkdir -p backup
          umask 077
          {
            echo "set ftp:ssl-allow no"
            echo "set net:max-retries 5"
            echo "set net:timeout 30"
            echo "set net:reconnect-interval-base 5"
            echo "open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\""
            echo "cls -1 /"
            echo "mirror --parallel=4 --no-perms --exclude-glob vendor/ --exclude-glob node_modules/ --exclude-glob .git/ --exclude-glob cache/ / backup/"
          } > lftp.rc
          lftp -f lftp.rc
          rm -f lftp.rc
          echo "Скачано:"
          for d in backup/*/; do echo "$(find "$d" -type f | wc -l) файлов, $(du -sh "$d" | cut -f1)  $d"; done

      - name: Encrypt
        run: |
          stamp=$(date -u +%Y-%m-%d)
          tar -czf sites.tar.gz -C backup .
          openssl rand -hex 32 > key.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:key.txt -in sites.tar.gz -out "sites-$stamp.tar.gz.enc"
          openssl pkeyutl -encrypt -pubin -inkey .github/backup/public-key.pem -pkeyopt rsa_padding_mode:oaep -in key.txt -out "sites-$stamp.key.enc"
          rm -rf key.txt sites.tar.gz backup
          ls -la sites-*

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sites-backup
          path: sites-*
          retention-days: 1
          compression-level: 0
