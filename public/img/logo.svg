<svg xmlns="http://www.w3.org/2000/svg" viewBox="190 0 600 880" role="img" aria-label="Success">
  <title>Success</title>
  <!-- Орбита (чёрные кольца из 3D-анимации) -->
  <ellipse cx="455" cy="760" rx="150" ry="120" fill="none" stroke="#0b0f0d" stroke-width="16" opacity=".85"/>
  <!-- Разомкнутое серое кольцо -->
  <g fill="none" stroke="#8a8f8c" stroke-width="44" transform="rotate(-150 440 600)">
    <circle cx="440" cy="600" r="195" stroke-dasharray="330 55 250 55 260 55 220 60" />
  </g>
  <!-- Зелёная «гребёнка» -->
  <g fill="#22c55e">
    <rect x="505" y="20" width="46" height="820" rx="4"/>
    <rect x="318" y="20" width="233" height="44" rx="4"/>
    <rect x="318" y="105" width="210" height="40" rx="4"/>
    <rect x="318" y="188" width="210" height="40" rx="4"/>
    <rect x="583" y="200" width="40" height="575" rx="4" fill="#16a34a"/>
  </g>
  <!-- Малые серые зубцы -->
  <g fill="#8a8f8c">
    <rect x="652" y="112" width="70" height="26" rx="3"/>
    <rect x="652" y="156" width="70" height="26" rx="3"/>
    <rect x="652" y="200" width="70" height="26" rx="3"/>
  </g>
  <path d="M640 80 A110 110 0 1 1 760 330" fill="none" stroke="#0b0f0d" stroke-width="16" opacity=".85"/>
</svg>
