<body>
  <canvas id="scene"></canvas>
  <h1 class="title">Наш дом<small class="txt">Нажмите на комнату — покажу размеры. Размеры по видео, примерные; мебель — вариант дизайна.</small></h1>

<section class="tour" id="tour" aria-label="Экскурсия по участку" hidden>

<script type="module">
import { loadHouse } from './assets/house.js?v=22';
import { createViewer } from './assets/view3d.js?v=22';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const card = document.getElementById('card');
const FLOORS = [['', 'Без отделки'], ['#d9b98c', 'Ламинат: светлый дуб'], ['#a0704a', 'Ламинат: орех'], ['#a8a49c', 'Ламинат: серый'], ['#ece9e3', 'Плитка: светлая'], ['#5e5a55', 'Плитка: тёмная'], ['#c9a27a', 'Паркет']];
const list = (title, items, empty) => `<h3>${title}</h3>` + (items.length ? `<ul>${items.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>` : `<p class="muted">${empty}</p>`);
const h = await loadHouse();
const design = await fetch('data/design.json', { cache: 'no-cache' }).then((r) => r.ok ? r.json() : null).catch(() => null);
const v = createViewer(document.getElementById('scene'), h, (r) => {
  if (!r) { card.hidden = true; return; }
  card.innerHTML = `<button class="close" type="button" aria-label="Закрыть">×</button>
    <h2>${esc(r.name)}</h2>${r.hint ? `<div class="muted">пометка: ${esc(r.hint)}</div>` : ''}
    <div class="big">${esc(r.size)} <small class="muted">${esc(r.tol)}</small></div>
    <div class="muted">площадь ${esc(r.area)} · высота стен ${esc(r.height)} · уверенность: ${esc(r.confidence)}</div>
    <div class="muted">для ремонта: ${esc(r.finish)} · <a href="smeta.html">смета</a></div>
    <h3>Пол — примерить</h3>
    <div class="swatches">${FLOORS.map(([c, n]) => `<button type="button" data-floor="${c}" title="${n}" aria-label="${n}" aria-pressed="${(v.floorFinish(r.id) || "") === c}" style="background:${c || 'repeating-linear-gradient(45deg,#f6f2ea 0 6px,#e4ded3 6px 12px)'}"></button>`).join('')}</div>
    ${r.note ? `<p class="muted">${esc(r.note)}</p>` : ''}
    ${list('Окна', r.windows, 'нет')}
    ${list('Двери и проёмы', r.doors, 'нет')}
    ${list('Электрика (места не измерены)', r.electric, 'на видео не видно')}
    ${r.plumbing.length ? list('Трубы', r.plumbing, '') : ''}`;
  card.hidden = false;
  card.querySelector('.close').onclick = () => v.select(null);
  card.querySelectorAll('[data-floor]').forEach((b) => b.onclick = () => {
    v.setFloor(r.id, b.dataset.floor);
    card.querySelectorAll('[data-floor]').forEach((x) => x.setAttribute('aria-pressed', x === b));
  });
}, design);
document.querySelectorAll('[data-view]').forEach((b) => b.onclick = () => {
  v.view(b.dataset.view);
  // общий вид участка красивее с крышей: включаем её, если была снята
  const roofBtn = document.querySelector('[data-layer="roof"]');

});
const legend = document.getElementById('legend');
const LEGEND = {
  electric: `<b>Электрика</b> · <i style="border-color:#2f6fd0"></i>розетки <i style="border-color:#2f9e44"></i>выключатели <i style="border-color:#6b7480"></i>коробки и выводы <i style="border-color:#e8590c"></i>щиток <i style="border-color:#f0b400"></i>свет<br><span class="muted">Что есть в комнате — видно на видео. Место на стене условное, не измерено.</span>`,
  attic: `<b>Мансарда — вариант</b><br><span class="muted">По прошлому плану мансарды, переложен на новый дом. Пол и скаты — оценка, не замер.</span>`,
  stair: `<b>Лестница — предварительно</b><br><span class="muted">По эскизу владельца: забежные ступени на старте и в углу у санузла. Число ступеней — проверочный расчёт.</span>`,
};
const showLegend = () => {
  const on = ['electric', 'attic', 'stair'].filter((k) => v.isOn(k));
  legend.hidden = !on.length;

document.querySelectorAll('[data-layer]').forEach((b) => b.onclick = () => {
  const on = b.getAttribute('aria-pressed') !== 'true';
  b.setAttribute('aria-pressed', on);
  v.layer(b.dataset.layer, on);

  if (b.dataset.layer === 'attic' && on) v.view('attic');

const toggle = (id, fn) => { const b = document.getElementById(id); b.onclick = () => { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); fn(on); }; };
toggle('btnRotate', v.autoRotate);
const loading = document.getElementById('loading');
v.onProgress((p) => {
  if (p === -1) { document.getElementById('loadText').textContent = 'Участок не загрузился — дом показан без него.'; setTimeout(() => loading.classList.add('done'), 3000); return; }
  if (p != null) { document.getElementById('loadBar').style.width = Math.max(8, Math.round(p * 100)) + '%'; document.getElementById('loadText').textContent = 'Загружаю участок и мебель… ' + Math.round(p * 100) + ' %'; }
});
v.onLoad(() => loading.classList.add('done'));
if (!design?.site_model) loading.classList.add('done');
const walkBtn = document.getElementById('btnWalk'), pad = document.getElementById('pad'), walkHint = document.getElementById('walkHint');
const setWalkUi = (on) => {
  walkBtn.setAttribute('aria-pressed', on);

walkBtn.onclick = () => { const on = !v.walking; v.walk(on); setWalkUi(on); };

pad.querySelectorAll('button:not(#btnRun)').forEach((b) => {
  const on = (ev) => { ev.preventDefault(); joy = { f: +(b.dataset.f || 0), t: +(b.dataset.t || 0) }; v.walkMove(joy.f, joy.t); };
  const off = () => { joy = { f: 0, t: 0 }; v.walkMove(0, 0); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);

toggle('btnWire', v.wireframe);
toggle('btnEvening', (on) => { v.evening(on); document.body.classList.toggle('evening', on); });
// линейка: две точки → расстояние (размеры дома — оценка по видео)
const rulerBtn = document.getElementById('btnRuler'), rulerHint = document.getElementById('rulerHint');
const nfr = (v) => v.toLocaleString('ru-RU', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

  const on = rulerBtn.getAttribute('aria-pressed') !== 'true';
  rulerBtn.setAttribute('aria-pressed', on);

  rulerHint.textContent = 'Линейка: нажмите на первую точку на полу или стене';
  v.ruler(on, (r) => {
    if (!r) rulerHint.textContent = 'Линейка: нажмите на первую точку на полу или стене';
    else if (r.first) rulerHint.textContent = 'Теперь — вторая точка';
    else rulerHint.innerHTML = `≈ <b>${nfr(r.d)} м</b> (по полу ${nfr(r.horiz)} м, по высоте ${nfr(r.dy)} м) — по оценке с видео. Нажмите ещё раз для нового замера.`;
  });
};
const stops = [
  ['Общий вид участка', [-9, 13, 14, 12, 0, -14], 'Отсюда видно, как расположены дом, двор и пристройка вдоль забора.'],
  ['Крыльцо', [1, 3.2, 2.5, 9, 1.2, -6], 'Подойдём ко входу в дом со стороны улицы.'],
  ['Проезд и гирлянды', [19, 2.2, -2, 20, 1.2, -12], 'От ворот вдоль дома идёт проезд, над которым натянуты гирлянды.'],
  ['Барбекю-зона', [17.5, 3, -6.5, 24, 1, -9], 'Под навесом видны мангал, печи для казанов и рабочий стол.'],
  ['Гараж с машиной', [22.2, 8.5, 3.8, 25.4, 0.4, -3.2], 'Со снятой крышей видно, как машина стоит относительно ворот и стеллажа.'],
  ['Зона отдыха с перголой', [7, 5, -24, 19, 0, -33], 'В глубине двора терраса с перголой выходит к саду.'],
  ['Беседка и огород', [10, 6, -18, 3, 0, -28], 'С этой стороны видно беседку и ряд грядок вдоль левой части участка.'],
  ['Вечер во дворе', [6, 7, 6, 17, 0, -12], 'Гирлянды и фонари подсвечивают двор в вечернем режиме.'],
];
const tour = document.getElementById('tour'), tourBtn = document.getElementById('btnTour');
const tourStop = document.getElementById('tourStop'), caption = document.getElementById('tourCaption');
const previous = document.getElementById('tourPrevious'), next = document.getElementById('tourNext');
const eveningBtn = document.getElementById('btnEvening'), rotateBtn = document.getElementById('btnRotate');
const tourLayers = ['roof', 'site', 'outbuilding', 'design'].map((layer) => document.querySelector(`[data-layer="${layer}"]`));
const pressed = (button) => button.getAttribute('aria-pressed') === 'true';
const setPressed = (button, on) => { if (pressed(button) !== on) button.click(); };
stops.forEach(([name], i) => tourStop.add(new Option(`${i + 1}. ${name}`, String(i))));
let tourFrame = 0, oldView = null;
function goToStop(index) {
  const [, camera, description] = stops[index];
  tourStop.value = String(index);
  caption.textContent = description;
  previous.disabled = index === 0;
  next.disabled = index === stops.length - 1;
  tourLayers.forEach((button) => setPressed(button, index !== 4 || button.dataset.layer !== 'roof'));
  setPressed(eveningBtn, index === 7);
  cancelAnimationFrame(tourFrame);
  const from = v.getCamera(), start = performance.now();
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    v.setCamera(camera);
    return;
  }
  function animate(now) {
    const t = Math.min(1, (now - start) / 900), ease = t * t * (3 - 2 * t);
    v.setCamera(camera.map((value, i) => from[i] + (value - from[i]) * ease));
    if (t < 1) tourFrame = requestAnimationFrame(animate);
  }
  tourFrame = requestAnimationFrame(animate);
}
function closeTour({ focus = true } = {}) {
  if (!oldView) return;
  cancelAnimationFrame(tourFrame);
  tour.hidden = true;
  tourBtn.setAttribute('aria-expanded', 'false');
  tourLayers.forEach((button, i) => setPressed(button, oldView.layers[i]));
  setPressed(eveningBtn, oldView.evening);
  setPressed(rotateBtn, oldView.rotate);
  oldView = null;
  if (focus) tourBtn.focus();
}
tourBtn.onclick = () => {
  if (oldView) { closeTour(); return; }
  if (v.walking) walkBtn.click();
  if (pressed(rulerBtn)) rulerBtn.click();
  v.select(null);
  oldView = { layers: tourLayers.map(pressed), evening: pressed(eveningBtn), rotate: pressed(rotateBtn) };
  setPressed(rotateBtn, false);
  tour.hidden = false;
  tourBtn.setAttribute('aria-expanded', 'true');
  goToStop(0);
  tourStop.focus({ preventScroll: true });
};
previous.onclick = () => goToStop(Number(tourStop.value) - 1);
next.onclick = () => goToStop(Number(tourStop.value) + 1);
tourStop.onchange = () => goToStop(Number(tourStop.value));
document.getElementById('tourClose').onclick = () => closeTour();
tour.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') closeTour();
});
document.querySelectorAll('[data-view], #btnWalk, #btnRuler').forEach((button) => {
  button.addEventListener('click', () => closeTour({ focus: false }), { capture: true });
});

// «Ссылка на вид»: ракурс камеры и включённые слои в адресе
document.getElementById('btnShare').onclick = async (ev) => {
  const layers = [...document.querySelectorAll('[data-layer]')].filter((b) => b.getAttribute('aria-pressed') === 'true').map((b) => b.dataset.layer);
  const url = new URL(location.href.split('?')[0]);
  url.searchParams.set('cam', v.getCamera().join(','));
  url.searchParams.set('layers', layers.join(','));
  const b = ev.currentTarget;
  try {
    if (navigator.share && matchMedia('(pointer: coarse)').matches) await navigator.share({ title: 'Наш дом — 3D', url: url.href });
    else { await navigator.clipboard.writeText(url.href); b.textContent = '✓ Скопировано'; setTimeout(() => { b.textContent = '🔗 Ссылка на вид'; }, 2500); }
  } catch { prompt('Скопируйте ссылку:', url.href); }
};
// ?view=front&show=dims,electric — для ссылок с главной
const q = new URLSearchParams(location.search);
if (q.get('view') === 'walk') { v.walk(true); setWalkUi(true); } else if (q.get('view')) v.view(q.get('view'));
for (const l of (q.get('show') || '').split(',').filter(Boolean)) document.querySelector(`[data-layer="${l}"]`)?.click();
if (q.has('layers')) {
  const want = new Set(q.get('layers').split(',').filter(Boolean));
  document.querySelectorAll('[data-layer]').forEach((b) => { if ((b.getAttribute('aria-pressed') === 'true') !== want.has(b.dataset.layer)) b.click(); });
}
if (q.get('room')) setTimeout(() => v.focusRoom(q.get('room')), 300);
if (q.get('cam')) setTimeout(() => v.setCamera(q.get('cam').split(',').map(Number)), q.has('layers') && q.get('layers').includes('attic') ? 800 : 0);
</script>
</body>
