<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Наш дом — 3D</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --sky-top: #cfd8dc; --sky-bottom: #eef1f2; --ink: #22303a; --muted: #5d6d78; --panel: rgba(255,255,255,.86); --accent: #2f6f8f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font-family: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: linear-gradient(var(--sky-top), var(--sky-bottom)); }
  #scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #scene:active { cursor: grabbing; }
  .title { position: fixed; left: 24px; top: calc(20px + env(safe-area-inset-top, 0px)); margin: 0; font-size: clamp(22px, 3vw, 32px); font-weight: 600; letter-spacing: -.01em; pointer-events: none; }
  .title small { display: block; font-size: 14px; font-weight: 400; color: var(--muted); margin-top: 4px; max-width: 420px; }
  .links { position: fixed; right: 24px; top: calc(20px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .links a { font-size: 14px; color: var(--accent); text-decoration: none; background: var(--panel); padding: 7px 12px; border-radius: 9px; box-shadow: 0 4px 14px rgba(34,48,58,.12); }
  .links a:hover { text-decoration: underline; }
  .controls { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 6px; width: max-content; max-width: calc(100vw - 24px);
    background: var(--panel); backdrop-filter: blur(10px); border-radius: 14px; box-shadow: 0 6px 24px rgba(34,48,58,.15); }
  .controls button { font: inherit; font-size: 14px; color: var(--ink); background: transparent; border: 0; border-radius: 9px; padding: 9px 11px; cursor: pointer; white-space: nowrap; }
  .controls button:hover { background: rgba(47,111,143,.1); }
  .controls button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .controls .sep { width: 1px; background: rgba(34,48,58,.15); margin: 4px 2px; }
  .card { position: fixed; left: 24px; top: calc(140px + env(safe-area-inset-top, 0px)); width: min(360px, calc(100vw - 48px)); max-height: calc(100vh - 240px); overflow: auto;
    background: var(--panel); backdrop-filter: blur(10px); border-radius: 14px; box-shadow: 0 6px 24px rgba(34,48,58,.15); padding: 16px 18px; font-size: 14px; line-height: 1.45; }
  .card[hidden] { display: none; }
  .card h2 { margin: 0 24px 2px 0; font-size: 19px; }
  .card .close { position: absolute; right: 10px; top: 8px; border: 0; background: none; font-size: 22px; cursor: pointer; color: var(--muted); }
  .card .big { font-size: 22px; font-weight: 600; margin: 6px 0 2px; }
  .card .muted { color: var(--muted); }
  .card h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 12px 0 4px; }
  .card ul { margin: 0; padding-left: 18px; }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
  .swatches button { width: 30px; height: 30px; border-radius: 8px; border: 2px solid rgba(34,48,58,.15); cursor: pointer; }
  .swatches button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px #fff inset; }
  .legend { position: fixed; right: 24px; top: calc(110px + env(safe-area-inset-top, 0px)); max-width: 330px; background: var(--panel); backdrop-filter: blur(10px); border-radius: 12px; box-shadow: 0 4px 14px rgba(34,48,58,.12); padding: 9px 12px; font-size: 12.5px; line-height: 1.45; }
  .legend[hidden], body.notext .txt { display: none; }
  .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; border: 2.5px solid; margin: 0 4px -1px 0; }
  .legend .muted { color: var(--muted); }
  .pad { position: fixed; right: 20px; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(2, 56px); gap: 6px; }
  .pad[hidden] { display: none; }
  .pad button { font-size: 22px; border: 0; border-radius: 14px; background: var(--panel); box-shadow: 0 4px 14px rgba(34,48,58,.15); touch-action: none; user-select: none; -webkit-user-select: none; }
  .pad button:active { background: var(--accent); color: #fff; }
  .pad .up { grid-column: 2; } .pad .left { grid-column: 1; grid-row: 2; } .pad .down { grid-column: 2; grid-row: 2; } .pad .right { grid-column: 3; grid-row: 2; }
  .walk-hint { position: fixed; left: 50%; transform: translateX(-50%); top: calc(16px + env(safe-area-inset-top, 0px)); background: rgba(21,26,30,.82); color: #fff; padding: 8px 14px; border-radius: 12px; font-size: 13px; text-align: center; }
  .walk-hint[hidden] { display: none; }
  body.walking .title, body.walking .links, body.walking .legend, body.walking .card { display: none; }
  .loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--panel); backdrop-filter: blur(10px); border-radius: 14px; box-shadow: 0 6px 24px rgba(34,48,58,.15); padding: 14px 18px; font-size: 14px; color: var(--muted); text-align: center; min-width: 240px; transition: opacity .4s; }
  .loading.done { opacity: 0; pointer-events: none; }
  .loading .bar { height: 6px; border-radius: 3px; background: rgba(34,48,58,.1); overflow: hidden; margin-bottom: 8px; }
  .loading .bar i { display: block; height: 100%; width: 8%; background: var(--accent); transition: width .2s; }
  @media (max-width: 700px) {
    .controls { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; left: 8px; right: 8px; transform: none; width: auto; max-width: none; scrollbar-width: none; }
    .controls::-webkit-scrollbar { display: none; }
    .controls .sep { flex: none; }
    .pad { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); right: 12px; }
  }
  .hint { position: fixed; left: 24px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); font-size: 12px; color: var(--muted); max-width: 260px; }
  @media (max-width: 900px) { .hint { display: none; } }
  @media (max-width: 520px) {
    .controls button { padding: 8px 9px; font-size: 13px; }
    .card { top: auto; bottom: 150px; max-height: 40vh; }
    .links { right: 12px; } .title { left: 12px; } .title small { display: none; }
    .legend { right: 12px; left: 12px; top: calc(64px + env(safe-area-inset-top, 0px)); max-width: none; }
  }
</style>
<script type="importmap">{"imports": {"three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/"}}</script>
</head>
<body>
  <canvas id="scene"></canvas>
  <h1 class="title">Наш дом<small class="txt">Нажмите на комнату — покажу размеры. Размеры по видео, примерные; мебель — вариант дизайна.</small></h1>
  <div class="legend txt" id="legend" hidden></div>
  <nav class="links">
    <a href="index.html">← На главную</a>
    <a href="plan.html">План и размеры</a>
    <a href="smeta.html">Смета ремонта</a>
  </nav>
  <aside class="card" id="card" hidden aria-live="polite"></aside>
  <div class="loading" id="loading" role="status"><div class="bar"><i id="loadBar"></i></div><span id="loadText">Загружаю участок и мебель…</span></div>
  <div class="walk-hint" id="walkHint" hidden>Прогулка: <b>W A S D</b> или стрелки — идти, мышью или пальцем — осмотреться. Начинаем у входной двери.</div>
  <div class="pad" id="pad" hidden aria-label="Управление прогулкой">
    <button class="up" data-f="1" aria-label="Вперёд">▲</button>
    <button class="left" data-t="-1" aria-label="Повернуть влево">◀</button>
    <button class="down" data-f="-1" aria-label="Назад">▼</button>
    <button class="right" data-t="1" aria-label="Повернуть вправо">▶</button>
  </div>
  <div class="controls" role="toolbar" aria-label="Управление видом">
    <button data-view="reset">Дом</button>
    <button data-view="site">Участок</button>
    <button data-view="front">Спереди</button>
    <button data-view="side">Сбоку</button>
    <button data-view="back">Сзади</button>
    <button data-view="top">Сверху</button>
    <button id="btnWalk" aria-pressed="false" title="Пройтись по дому от первого лица">🚶 Прогулка</button>
    <span class="sep"></span>
    <button data-layer="dims" aria-pressed="false">Размеры</button>
    <button data-layer="electric" aria-pressed="false">Электрика</button>
    <button data-layer="design" aria-pressed="true" title="Мебель и назначение комнат из прошлого дизайн-проекта">Мебель</button>
    <button data-layer="site" aria-pressed="true" title="Участок из прошлой модели">Двор</button>
    <button data-layer="roof" aria-pressed="false">Крыша</button>
    <button data-layer="stair" aria-pressed="false">Лестница</button>
    <button data-layer="attic" aria-pressed="false" title="Мансарда — вариант по прошлому плану">Мансарда</button>
    <span class="sep"></span>
    <button data-layer="labels" aria-pressed="true" title="Показать или скрыть все надписи">Текст</button>
    <button id="btnRotate" aria-pressed="false">Поворот</button>
    <button id="btnWire" aria-pressed="false">Каркас</button>
    <button id="btnShare" title="Скопировать ссылку на этот ракурс со слоями">🔗 Ссылка на вид</button>
  </div>
<script type="module">
import { loadHouse } from './assets/house.js?v=12';
import { createViewer } from './assets/view3d.js?v=12';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const card = document.getElementById('card');
const FLOORS = [['', 'Без отделки'], ['#d9b98c', 'Ламинат: светлый дуб'], ['#a0704a', 'Ламинат: орех'], ['#a8a49c', 'Ламинат: серый'], ['#ece9e3', 'Плитка: светлая'], ['#5e5a55', 'Плитка: тёмная'], ['#c9a27a', 'Паркет']];
const list = (title, items, empty) => `<h3>${title}</h3>` + (items.length ? `<ul>${items.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>` : `<p class="muted">${empty}</p>`);
const h = await loadHouse();
const design = await fetch('data/design.json', { cache: 'no-cache' }).then((r) => r.ok ? r.json() : null).catch(() => null);
const v = createViewer(document.getElementById('scene'), h, (r) => {
  if (!r) { card.hidden = true; return; }
  card.innerHTML = `<button class="close" type="button" aria-label="Закрыть">×</button>
    <h2>${esc(r.name)}</h2>${r.hint ? `<div class="muted">пометка: ${esc(r.hint)}</div>` : ''}
    <div class="big">${esc(r.size)} <small class="muted">${esc(r.tol)}</small></div>
    <div class="muted">площадь ${esc(r.area)} · высота стен ${esc(r.height)} · уверенность: ${esc(r.confidence)}</div>
    <div class="muted">для ремонта: ${esc(r.finish)} · <a href="smeta.html">смета</a></div>
    <h3>Пол — примерить</h3>
    <div class="swatches">${FLOORS.map(([c, n]) => `<button type="button" data-floor="${c}" title="${n}" aria-label="${n}" aria-pressed="${(v.floorFinish(r.id) || "") === c}" style="background:${c || 'repeating-linear-gradient(45deg,#f6f2ea 0 6px,#e4ded3 6px 12px)'}"></button>`).join('')}</div>
    ${r.note ? `<p class="muted">${esc(r.note)}</p>` : ''}
    ${list('Окна', r.windows, 'нет')}
    ${list('Двери и проёмы', r.doors, 'нет')}
    ${list('Электрика (места не измерены)', r.electric, 'на видео не видно')}
    ${r.plumbing.length ? list('Трубы', r.plumbing, '') : ''}`;
  card.hidden = false;
  card.querySelector('.close').onclick = () => v.select(null);
  card.querySelectorAll('[data-floor]').forEach((b) => b.onclick = () => {
    v.setFloor(r.id, b.dataset.floor);
    card.querySelectorAll('[data-floor]').forEach((x) => x.setAttribute('aria-pressed', x === b));
  });
}, design);
document.querySelectorAll('[data-view]').forEach((b) => b.onclick = () => v.view(b.dataset.view));
const legend = document.getElementById('legend');
const LEGEND = {
  electric: `<b>Электрика</b> · <i style="border-color:#2f6fd0"></i>розетки <i style="border-color:#2f9e44"></i>выключатели <i style="border-color:#6b7480"></i>коробки и выводы <i style="border-color:#e8590c"></i>щиток <i style="border-color:#f0b400"></i>свет<br><span class="muted">Что есть в комнате — видно на видео. Место на стене условное, не измерено.</span>`,
  attic: `<b>Мансарда — вариант</b><br><span class="muted">По прошлому плану мансарды, переложен на новый дом. Пол и скаты — оценка, не замер.</span>`,
  stair: `<b>Лестница — предварительно</b><br><span class="muted">По эскизу владельца: забежные ступени на старте и в углу у санузла. Число ступеней — проверочный расчёт.</span>`,
};
const showLegend = () => {
  const on = ['electric', 'attic', 'stair'].filter((k) => v.isOn(k));
  legend.hidden = !on.length;
  legend.innerHTML = on.map((k) => LEGEND[k]).join('<hr style="border:0;border-top:1px solid rgba(34,48,58,.12);margin:6px 0">');
};
document.querySelectorAll('[data-layer]').forEach((b) => b.onclick = () => {
  const on = b.getAttribute('aria-pressed') !== 'true';
  b.setAttribute('aria-pressed', on);
  v.layer(b.dataset.layer, on);
  if (b.dataset.layer === 'labels') document.body.classList.toggle('notext', !on);
  if (b.dataset.layer === 'attic' && on) v.view('attic');
  showLegend();
});
const toggle = (id, fn) => { const b = document.getElementById(id); b.onclick = () => { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); fn(on); }; };
toggle('btnRotate', v.autoRotate);
const loading = document.getElementById('loading');
v.onProgress((p) => {
  if (p === -1) { document.getElementById('loadText').textContent = 'Участок не загрузился — дом показан без него.'; setTimeout(() => loading.classList.add('done'), 3000); return; }
  if (p != null) { document.getElementById('loadBar').style.width = Math.max(8, Math.round(p * 100)) + '%'; document.getElementById('loadText').textContent = 'Загружаю участок и мебель… ' + Math.round(p * 100) + ' %'; }
});
v.onLoad(() => loading.classList.add('done'));
if (!design?.site_model) loading.classList.add('done');
const walkBtn = document.getElementById('btnWalk'), pad = document.getElementById('pad'), walkHint = document.getElementById('walkHint');
const setWalkUi = (on) => {
  walkBtn.setAttribute('aria-pressed', on);
  walkBtn.textContent = on ? '✕ Выйти из прогулки' : '🚶 Прогулка';
  pad.hidden = !on; walkHint.hidden = !on;
  document.body.classList.toggle('walking', on);
  if (on) { card.hidden = true; setTimeout(() => { walkHint.hidden = true; }, 6000); }
};
walkBtn.onclick = () => { const on = !v.walking; v.walk(on); setWalkUi(on); };
document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => setWalkUi(false)));
let joy = { f: 0, t: 0 };
pad.querySelectorAll('button').forEach((b) => {
  const on = (ev) => { ev.preventDefault(); joy = { f: +(b.dataset.f || 0), t: +(b.dataset.t || 0) }; v.walkMove(joy.f, joy.t); };
  const off = () => { joy = { f: 0, t: 0 }; v.walkMove(0, 0); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);
});
toggle('btnWire', v.wireframe);
// «Ссылка на вид»: ракурс камеры и включённые слои в адресе
document.getElementById('btnShare').onclick = async (ev) => {
  const layers = [...document.querySelectorAll('[data-layer]')].filter((b) => b.getAttribute('aria-pressed') === 'true').map((b) => b.dataset.layer);
  const url = new URL(location.href.split('?')[0]);
  url.searchParams.set('cam', v.getCamera().join(','));
  url.searchParams.set('layers', layers.join(','));
  const b = ev.currentTarget;
  try {
    if (navigator.share && matchMedia('(pointer: coarse)').matches) await navigator.share({ title: 'Наш дом — 3D', url: url.href });
    else { await navigator.clipboard.writeText(url.href); b.textContent = '✓ Скопировано'; setTimeout(() => { b.textContent = '🔗 Ссылка на вид'; }, 2500); }
  } catch { prompt('Скопируйте ссылку:', url.href); }
};
// ?view=front&show=dims,electric — для ссылок с главной
const q = new URLSearchParams(location.search);
if (q.get('view') === 'walk') { v.walk(true); setWalkUi(true); } else if (q.get('view')) v.view(q.get('view'));
for (const l of (q.get('show') || '').split(',').filter(Boolean)) document.querySelector(`[data-layer="${l}"]`)?.click();
if (q.has('layers')) {
  const want = new Set(q.get('layers').split(',').filter(Boolean));
  document.querySelectorAll('[data-layer]').forEach((b) => { if ((b.getAttribute('aria-pressed') === 'true') !== want.has(b.dataset.layer)) b.click(); });
}
if (q.get('cam')) setTimeout(() => v.setCamera(q.get('cam').split(',').map(Number)), q.has('layers') && q.get('layers').includes('attic') ? 800 : 0);
</script>
</body>
</html>
